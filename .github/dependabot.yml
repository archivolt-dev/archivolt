version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      all-gradle: { patterns: ["*"] }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
