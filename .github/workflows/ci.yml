name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job name is referenced by the branch ruleset as a required status check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read JDK version
        id: jdk
        run: echo "version=$(grep '^archivolt.jdk=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Placeholder until the first Testcontainers-based tests exist.
      - name: Integration tests
        run: echo "No integration tests yet."
