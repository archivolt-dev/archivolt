name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job name is referenced by the branch ruleset as a required status check.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read JDK version
        id: jdk
        run: echo "version=$(grep '^archivolt.jdk=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start local infrastructure
        run: |
          echo "NEO4J_PASSWORD=$(openssl rand -hex 16)" > infra/.env
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180

      - name: Check APOC
        run: |
          set -a; . infra/.env; set +a
          docker compose -f infra/docker-compose.yml exec -T neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" "RETURN apoc.version() AS apoc;"

      - name: Stop local infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
