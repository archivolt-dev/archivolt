name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # toolchain z build-logic może dociągnąć inną wersję (S2 → 23+)

      - name: Set up Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: hashFiles('gradlew') != ''
        run: ./gradlew build --stacktrace

      - name: Nothing to build yet
        if: hashFiles('gradlew') == ''
        run: echo "No Gradle build yet (AL-001)."
